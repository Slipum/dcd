[package]
name = "dcd"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "GitOps-CD for Docker Compose without Kubernetes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mod_module_files = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"